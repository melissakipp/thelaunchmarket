version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use the pre-installed Node version or specify one that's already cached
        - node --version
        - npm --version
        # Use npm ci for faster, more reliable installs
        - npm ci
        # Verify TypeScript is installed from package.json
        - npx tsc --version
    build:
      commands:
        - |
          echo "Environment Check:"
          echo "NODE_ENV: $NODE_ENV"
          echo "EMAIL_USER exists: $(if [ ! -z "$EMAIL_USER" ]; then echo "YES"; else echo "NO"; fi)"
          echo "EMAIL_PASS exists: $(if [ ! -z "$EMAIL_PASS" ]; then echo "YES"; else echo "NO"; fi)"
        - echo "Starting build process..."
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*